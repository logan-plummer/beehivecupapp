<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Beehive Cup 2026 — Matchup Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#080808; color:#fff; font-family:'Barlow',Arial,sans-serif; min-height:100vh; }
.bc { font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif; }
.wrap { max-width:1200px; margin:0 auto; padding:24px 20px 60px; }
.header { display:flex; align-items:center; gap:16px; margin-bottom:24px; border-bottom:1px solid #1a1a1a; padding-bottom:20px; }
.header img { width:44px; height:44px; object-fit:contain; opacity:0.8; }
h1 { font-family:'Barlow Condensed',Arial,sans-serif; font-size:32px; font-weight:900; letter-spacing:0.04em; text-transform:uppercase; }
.btn { font-family:'Barlow Condensed',Arial,sans-serif; font-size:12px; font-weight:700; letter-spacing:0.14em; padding:9px 18px; border-radius:9px; border:1px solid #333; background:rgba(255,255,255,0.06); color:#fff; cursor:pointer; transition:background 0.15s; }
.btn:hover { background:rgba(255,255,255,0.12); }
.btn.gold { background:rgba(212,175,106,0.12); border-color:rgba(212,175,106,0.3); color:#D4AF6A; }
.sessions-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
.session-card { background:#0d0d0d; border:1px solid #1c1c1c; border-radius:14px; overflow:visible; }
.session-header { padding:12px 14px; border-bottom:1px solid #1c1c1c; background:#0a0a0a; border-radius:14px 14px 0 0; }
.sess-title { font-family:'Barlow Condensed',Arial,sans-serif; font-size:15px; font-weight:800; letter-spacing:0.06em; text-transform:uppercase; }
.sess-sub { font-family:'Barlow Condensed',Arial,sans-serif; font-size:9px; font-weight:700; letter-spacing:0.16em; color:#444; margin-top:3px; }
.match-row { padding:9px 12px; border-bottom:1px solid #111; display:grid; grid-template-columns:1fr 28px 1fr; align-items:center; gap:4px; }
.match-row:last-child { border-bottom:none; }
.side { display:flex; flex-direction:column; gap:4px; }
.side.right { align-items:flex-end; }
.vs-col { display:flex; flex-direction:column; align-items:center; gap:2px; }
.vs { font-family:'Barlow Condensed',Arial,sans-serif; font-size:9px; font-weight:700; color:#2a2a2a; }
.h2hstr { font-family:'Barlow Condensed',Arial,sans-serif; font-size:8px; letter-spacing:0.04em; }
.player-wrap { position:relative; display:inline-block; }
.pbadge { display:inline-flex; align-items:center; gap:4px; background:#141414; border:1px solid #222; border-radius:7px; padding:4px 9px; cursor:pointer; transition:all 0.12s; user-select:none; }
.pbadge:hover { border-color:#555; background:#1c1c1c; }
.pbadge .pname { font-family:'Barlow',Arial,sans-serif; font-size:12px; font-weight:600; color:#fff; }
.pflag { font-size:11px; line-height:1; }
.psel { position:absolute; top:calc(100% + 4px); left:0; z-index:200; background:#111; border:1px solid #333; border-radius:10px; padding:6px; min-width:170px; box-shadow:0 12px 32px rgba(0,0,0,0.9); }
.psel.right { left:auto; right:0; }
.popt { padding:7px 10px; cursor:pointer; border-radius:6px; font-family:'Barlow',Arial,sans-serif; font-size:13px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.popt:hover { background:#1e1e1e; }
.popt.cur { background:#1a1a1a; color:#D4AF6A; }
.popt.used { color:#444; cursor:not-allowed; }
.popt .ph2h { font-family:'Barlow Condensed',Arial,sans-serif; font-size:10px; color:#555; }
.score-bar { display:flex; align-items:center; gap:14px; background:#0d0d0d; border:1px solid #1c1c1c; border-radius:12px; padding:14px 20px; margin-bottom:14px; }
.snum { font-family:'Barlow Condensed',Arial,sans-serif; font-size:30px; font-weight:900; line-height:1; }
.slbl { font-family:'Barlow Condensed',Arial,sans-serif; font-size:9px; font-weight:700; letter-spacing:0.18em; color:#555; margin-top:2px; }
.track { flex:1; height:6px; background:#1a1a1a; border-radius:3px; overflow:hidden; display:flex; }
.analysis-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
.acard { background:#0d0d0d; border:1px solid #1c1c1c; border-radius:12px; padding:14px; }
.atitle { font-family:'Barlow Condensed',Arial,sans-serif; font-size:10px; font-weight:700; letter-spacing:0.2em; color:#555; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
.irow { font-family:'Barlow',Arial,sans-serif; font-size:12px; padding:5px 0; border-bottom:1px solid #141414; display:flex; justify-content:space-between; align-items:center; }
.irow:last-child { border-bottom:none; }
.chip { font-family:'Barlow Condensed',Arial,sans-serif; font-size:10px; font-weight:700; padding:2px 8px; border-radius:4px; }
.chip.red { background:rgba(232,112,112,0.15); color:#E87070; }
.chip.amber { background:rgba(240,165,0,0.15); color:#F0A500; }
.chip.green { background:rgba(111,207,138,0.15); color:#6FCF8A; }
.legend { display:flex; gap:20px; flex-wrap:wrap; margin-bottom:14px; }
.li { font-family:'Barlow',Arial,sans-serif; font-size:11px; color:#555; display:flex; align-items:center; gap:6px; }
</style>
</head>

    const p1a=a.includes(p1),p1b=b.includes(p1),p2a=a.includes(p2),p2b=b.includes(p2);
    if(!((p1a&&p2b)||(p1b&&p2a))) continue;
    const r=m.result||"H";
    if((p1a&&r==="A")||(p1b&&r==="B"))w++;
    else if((p1a&&r==="B")||(p1b&&r==="A"))l++;
    else d++;
  }
  return {w,l,d,total:w+l+d};
}

let sessions=[
  {name:"Session 1",fmt:"Scramble",course:"Wasatch Lakes",
    matches:[{a:["Logan","Marsh"],b:["Will","Zach"]},{a:["Josh","Joe"],b:["Caleb","Blake"]},
             {a:["Cale","Tommy"],b:["Dalton","Shane"]},{a:["Jason","Giff"],b:["Colton","Parker"]}]},
  {name:"Session 2",fmt:"Best Ball",course:"Wasatch Mountain",
    matches:[{a:["Cale","Josh"],b:["Will","Caleb"]},{a:["Logan","Jason"],b:["Dalton","Colton"]},
             {a:["Giff","Tommy"],b:["Parker","Shane"]},{a:["Joe","Marsh"],b:["Blake","Zach"]}]},
  {name:"Session 3",fmt:"Best Ball",course:"Soldier Hollow Gold",
    matches:[{a:["Logan","Josh"],b:["Will","Colton"]},{a:["Cale","Jason"],b:["Caleb","Dalton"]},
             {a:["Giff","Joe"],b:["Zach","Parker"]},{a:["Tommy","Marsh"],b:["Shane","Blake"]}]},
  {name:"Session 4",fmt:"Singles",course:"Soldier Hollow Silver",
    matches:[{a:["Logan"],b:["Will"]},{a:["Cale"],b:["Dalton"]},{a:["Josh"],b:["Colton"]},
             {a:["Jason"],b:["Caleb"]},{a:["Giff"],b:["Parker"]},{a:["Tommy"],b:["Shane"]},
             {a:["Joe"],b:["Blake"]},{a:["Marsh"],b:["Zach"]}]}
];

let activeMenu=null;
function closeMenu(){if(activeMenu){activeMenu.remove();activeMenu=null;}}
document.addEventListener("click",()=>closeMenu());

function partnerCounts(){
  const c={};
  sessions.forEach(s=>s.matches.forEach(m=>{
    const add=(x,y)=>{const k=[x,y].sort().join("|");c[k]=(c[k]||0)+1;};
    for(let i=0;i<m.a.length;i++)for(let j=i+1;j<m.a.length;j++)add(m.a[i],m.a[j]);
    for(let i=0;i<m.b.length;i++)for(let j=i+1;j<m.b.length;j++)add(m.b[i],m.b[j]);
  }));
  return c;
}

function oppCounts(){
  const c={};
  sessions.forEach(s=>s.matches.forEach(m=>{
    m.a.forEach(p=>m.b.forEach(q=>{const k=[p,q].sort().join("|");c[k]=(c[k]||0)+1;}));
  }));
  return c;
}

function usedPlayers(){
  const u={};
  sessions.forEach((s,si)=>s.matches.forEach((m,mi)=>{
    [...m.a,...m.b].forEach(p=>{if(!u[p])u[p]=[];u[p].push({si,mi});});
  }));
  return u;
}

function getFlags(player,side,si,mi){
  const pc=partnerCounts(),oc=oppCounts();
  const m=sessions[si].matches[mi];
  const myT=side==="a"?m.a:m.b,theirT=side==="a"?m.b:m.a;
  const flags=[];
  myT.filter(p=>p!==player).forEach(pt=>{
    const k=[player,pt].sort().join("|");
    if((pc[k]||0)>1)flags.push({type:"partner",with:pt});
  });
  theirT.forEach(op=>{
    const k=[player,op].sort().join("|");
    const cnt=oc[k]||0;
    if(cnt>1)flags.push({type:"opp",with:op,count:cnt});
    const h=getH2H(player,op);
    if(h.total===0)flags.push({type:"new",with:op});
  });
  return flags;
}

function renderBadge(player,side,si,mi,pi){
  const flags=getFlags(player,side,si,mi);
  const rp=flags.find(f=>f.type==="partner");
  const ro=flags.find(f=>f.type==="opp");
  const nw=flags.find(f=>f.type==="new");
  let icon="";
  if(rp) icon=`<span class="pflag" style="color:#E87070" title="Repeat partner: ${rp.with}">⚠</span>`;
  else if(ro) icon=`<span class="pflag" style="color:#F0A500" title="Faces ${ro.with} ${ro.count}x this Cup">↩</span>`;
  else if(nw) icon=`<span class="pflag" style="color:#6FCF8A" title="First time vs ${nw.with}">★</span>`;
  return `<div class="player-wrap"><div class="pbadge" onclick="openMenu(event,${si},${mi},'${side}',${pi})"><span class="pname">${player}</span>${icon}</div></div>`;
}

function openMenu(e,si,mi,side,pi){
  e.stopPropagation();closeMenu();
  const pool=side==="a"?OH:YG;
  const cur=sessions[si].matches[mi][side][pi];
  const used=usedPlayers();
  const isRight=side==="b";
  const menu=document.createElement("div");
  menu.className="psel"+(isRight?" right":"");
  pool.forEach(p=>{
    const inUse=used[p]&&!used[p].some(u=>u.si===si&&u.mi===mi);
    const div=document.createElement("div");
    div.className="popt"+(p===cur?" cur":"")+(inUse?" used":"");
    const theirT=sessions[si].matches[mi][side==="a"?"b":"a"];
    const h2hStrs=theirT.map(op=>{const h=getH2H(p,op);return h.total>0?`${h.w}-${h.l}-${h.d}`:"NEW";});
    div.innerHTML=`<span>${p}</span><span class="ph2h">${h2hStrs.join(" · ")}</span>`;
    div.onclick=()=>{if(inUse)return;sessions[si].matches[mi][side][pi]=p;closeMenu();render();};
    menu.appendChild(div);
  });
  e.currentTarget.appendChild(menu);activeMenu=menu;
}

function computeBalance(){
  let oh=0,yg=0,ev=0;
  sessions.forEach(s=>s.matches.forEach(m=>{
    let w=0,l=0;
    m.a.forEach(p=>m.b.forEach(q=>{
      const h=getH2H(p,q);
      if(OH.includes(p)&&YG.includes(q)){w+=h.w;l+=h.l;}
      else if(YG.includes(p)&&OH.includes(q)){w+=h.l;l+=h.w;}
    }));
    const pm=w-l;if(pm>0)oh++;else if(pm<0)yg++;else ev++;
  }));
  return {oh,yg,ev,total:oh+yg+ev};
}

function render(){
  const pc=partnerCounts(),oc=oppCounts();
  const b=computeBalance();
  const ohP=Math.round(b.oh/b.total*100),ygP=Math.round(b.yg/b.total*100);
  document.getElementById("score-bar").innerHTML=`
    <div><div class="slbl">OLD HEADS FAVORED</div><div class="snum">${b.oh}</div></div>
    <div class="track"><div style="width:${ohP}%;background:#fff"></div><div style="width:${100-ohP-ygP}%;background:#2a2a2a"></div><div style="width:${ygP}%;background:#555"></div></div>
    <div style="text-align:right"><div class="slbl">YOUNG GUNS FAVORED</div><div class="snum">${b.yg}</div></div>
    <div style="padding-left:14px;border-left:1px solid #1a1a1a;text-align:right"><div class="slbl">EVEN</div><div class="snum" style="color:#444">${b.ev}</div></div>`;

  let g="";
  sessions.forEach((s,si)=>{
    g+=`<div class="session-card"><div class="session-header"><div class="sess-title">${s.name}</div><div class="sess-sub">${s.fmt} · ${s.course}</div></div>`;
    s.matches.forEach((m,mi)=>{
      const aH=m.a.map((p,pi)=>renderBadge(p,"a",si,mi,pi)).join("");
      const bH=m.b.map((p,pi)=>renderBadge(p,"b",si,mi,pi)).join("");
      let h2h="";
      if(m.a.length===1&&m.b.length===1){
        const h=getH2H(m.a[0],m.b[0]);
        const c=h.total===0?"#6FCF8A":h.w>h.l?"#6FCF8A":h.l>h.w?"#E87070":"#888";
        h2h=`<div class="h2hstr" style="color:${c}">${h.total===0?"NEW":`${h.w}-${h.l}-${h.d}`}</div>`;
      }
      g+=`<div class="match-row"><div class="side">${aH}</div><div class="vs-col"><div class="vs">VS</div>${h2h}</div><div class="side right">${bH}</div></div>`;
    });
    g+="</div>";
  });
  document.getElementById("grid").innerHTML=g;

  const rP=[],rO=[],newM=[];
  Object.entries(pc).forEach(([k,v])=>{if(v>1)rP.push({pair:k.split("|").join(" & "),count:v});});
  Object.entries(oc).forEach(([k,v])=>{if(v>1)rO.push({pair:k.split("|").join(" vs "),count:v});});
  const seen=new Set();
  sessions.forEach(s=>s.matches.forEach(m=>m.a.forEach(p=>m.b.forEach(q=>{
    const k=[p,q].sort().join("|");
    if(!seen.has(k)&&getH2H(p,q).total===0){seen.add(k);newM.push(`${p} vs ${q}`);}
  }))));

  const ok='<span class="chip green">ALL CLEAR ✓</span>';
  document.getElementById("analysis").innerHTML=`
    <div class="acard">
      <div class="atitle">⚠ REPEAT PARTNERS ${rP.length===0?ok:""}</div>
      ${rP.length===0?'<div style="color:#6FCF8A;font-size:12px;">No repeat partners</div>':rP.map(r=>`<div class="irow"><span style="color:#ccc">${r.pair}</span><span class="chip red">${r.count}×</span></div>`).join("")}
    </div>
    <div class="acard">
      <div class="atitle">↩ REPEAT OPPONENTS ${rO.length===0?ok:""}</div>
      ${rO.length===0?'<div style="color:#6FCF8A;font-size:12px;">No repeat opponents</div>':rO.map(r=>`<div class="irow"><span style="color:#ccc">${r.pair}</span><span class="chip ${r.count>2?"red":"amber"}">${r.count}×</span></div>`).join("")}
    </div>`;
}

function exportMatchups(){
  const out=sessions.map(s=>({
    session:s.name,format:s.fmt,course:s.course,
    matches:s.matches.map(m=>`${m.a.join(" / ")} vs ${m.b.join(" / ")}`)
  }));
  document.getElementById("export-box").style.display="block";
  document.getElementById("export-text").textContent=out.map(s=>
    `[${s.session} — ${s.format} @ ${s.course}]\n`+s.matches.map((m,i)=>`  Match ${i+1}: ${m}`).join("\n")
  ).join("\n\n");
}

render();

</script>
